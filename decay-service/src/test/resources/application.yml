spring:
  datasource:
    url: jdbc:h2:mem:decay;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

decay:
  max-chain-length: 12
  near-equal-rel-tol: 1.0e-8
  max-grid-steps: 10000
  max-time-points: 10000
  max-batch-items: 200
  conservation-rel-tol: 1.0e-6
